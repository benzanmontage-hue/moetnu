<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diensten — Moetnu</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:image" content="https://moetnu.nl/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://moetnu.nl/assets/og-image.png">
  <meta name="description" content="Alle vaste diensten op Moetnu. Filter op categorie en regio.">
  <link rel="canonical" href="https://moetnu.nl/diensten.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Diensten — Moetnu">
  <meta property="og:description" content="Alle vaste diensten op Moetnu. Filter op categorie en regio.">
  <meta property="og:url" content="https://moetnu.nl/diensten.html">
  <meta property="og:site_name" content="Moetnu">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/fonts.css?v=20260919e">
  <link rel="stylesheet" href="css/style.css?v=20260919e">
</head>
<body data-page="diensten">
  <header id="header"></header>

  <main class="container page">
    <h1 class="page-title">Diensten</h1>
    <p class="page-sub mb-2">Boek direct een vaste dienst bij een vakman in de buurt.</p>

    <div class="searchbar searchbar--filter">
      <input id="f-q" type="text" placeholder="Zoek op trefwoord...">
      <select id="f-cat" aria-label="Categorie"><option value="">Alle categorieën</option></select>
      <select id="f-regio" aria-label="Regio">
        <option value="">Heel Nederland</option>
        <option>Amsterdam</option><option>Rotterdam</option><option>Utrecht</option>
        <option>Den Haag</option><option>Eindhoven</option><option>Groningen</option>
        <option>Arnhem</option><option>Nijmegen</option><option>Tilburg</option>
      </select>
      <button class="btn btn-primary" onclick="loadServices()">Filter</button>
    </div>

    <div class="grid grid-cards" id="service-grid">
    </div>
    <div class="empty" id="empty" style="display:none"><div class="big">🔍</div>Geen diensten gevonden.</div>
  </main>

  <footer>
    <div class="container">
      <div><img src="assets/logo-light.png" alt="Moetnu" class="logo-img-footer"></div>
      <div><a href="diensten.html">Diensten</a> · <a href="klussen.html">Klussen</a> · <a href="plaatsen.html">Plaatsen</a> · <a href="login.html">Inloggen</a> · <a href="privacy.html">Privacy</a> · <a href="voorwaarden.html">Voorwaarden</a></div>
    </div>
  </footer>

  <script src="js/config.js?v=20260919e"></script>
  <script src="js/db.js?v=20260919e"></script>
  <script src="js/app.js?v=20260919e"></script>
  <script>
    async function loadServices() {
      const q = document.getElementById("f-q").value.trim();
      const cat = document.getElementById("f-cat").value;
      const regio = document.getElementById("f-regio").value;
      const filter = { q, regio };
      if (cat) filter.category_id = cat;
      const services = await SF.getServices(filter);
      const cats = await SF.getCategories();
      const g = document.getElementById("service-grid");
      g.innerHTML = services.length ? services.map(svc =>
        `<a class="card" href="dienst.html?id=${svc.id}">
           <div class="card-body">
             <div class="meta"><span class="badge badge-cat">${esc(cats.find(c=>c.id===svc.category_id)?.naam || "Dienst")}</span><span class="badge badge-regio">📍 ${esc(svc.regio)}</span></div>
             <h3>${esc(svc.titel)}</h3>
             <div class="desc">${esc(svc.omschrijving || "")}</div>
             <div class="foot flex-between"><span class="price">${prijsLabel(svc)}</span><span class="btn btn-sm btn-dark">Bekijk</span></div>
           </div>
         </a>`).join("")
      : "";
      document.getElementById("empty").style.display = services.length ? "none" : "block";
    }
    document.addEventListener("DOMContentLoaded", async () => {
      // vul categorieën
      const cats = await SF.getCategories();
      document.getElementById("f-cat").innerHTML += cats.map(c => `<option value="${c.id}">${esc(c.icon||"")} ${esc(c.naam)}</option>`).join("");
      // lees URL-params (van home zoekbalk)
      const p = new URLSearchParams(location.search);
      if (p.get("q")) document.getElementById("f-q").value = p.get("q");
      if (p.get("regio")) document.getElementById("f-regio").value = p.get("regio");
      if (p.get("category")) document.getElementById("f-cat").value = p.get("category");
      await loadServices();
    });
  </script>
</body>
</html>
